spring.application.name=demo

# Shows in the console the SQL that Hibernate runs (nice while learning).
spring.jpa.show-sql=true

# Timeouts (in milliseconds) for calls made with OpenFeign, so the API does
# not hang for a long time when ViaCEP is slow or offline.
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
